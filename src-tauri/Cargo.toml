[package]
name = "globalwatch"
version = "0.1.0"
description = "3D globe displaying real-time global events"
authors = [""]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "globalwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
whisper-rs = "0.13"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
# piper-rs = "0.1"  # TODO: re-enable when Rust >= 1.88 (ort/ONNX Runtime MSRV)
